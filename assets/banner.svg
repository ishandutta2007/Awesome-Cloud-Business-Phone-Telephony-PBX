<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="callLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .telecom-grid { stroke: rgba(148, 163, 184, 0.07); stroke-width: 1; }
    .pulse-glow-1 { animation: pulse1 6s ease-in-out infinite alternate; }
    .pulse-glow-2 { animation: pulse2 7s ease-in-out infinite alternate; }
    .signal-wave { animation: dash 8s linear infinite; }
    .audio-bar-1 { animation: soundBar 1.2s ease-in-out infinite alternate; transform-origin: bottom; }
    .audio-bar-2 { animation: soundBar 0.9s ease-in-out infinite 0.2s alternate; transform-origin: bottom; }
    .audio-bar-3 { animation: soundBar 1.5s ease-in-out infinite 0.4s alternate; transform-origin: bottom; }
    .audio-bar-4 { animation: soundBar 1.1s ease-in-out infinite 0.1s alternate; transform-origin: bottom; }
    .audio-bar-5 { animation: soundBar 1.4s ease-in-out infinite 0.3s alternate; transform-origin: bottom; }
    .packet-dot { animation: packetMove 5s ease-in-out infinite; }

    @keyframes pulse1 {
      0% { transform: scale(0.9) translate(-30px, 0); opacity: 0.3; }
      100% { transform: scale(1.15) translate(20px, 15px); opacity: 0.7; }
    }
    @keyframes pulse2 {
      0% { transform: scale(1.1) translate(10px, 10px); opacity: 0.4; }
      100% { transform: scale(0.85) translate(-25px, -15px); opacity: 0.65; }
    }
    @keyframes dash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes soundBar {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1.1); }
    }
    @keyframes packetMove {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Subtle High-Tech Telephony Grid -->
  <g class="telecom-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="pulse-glow-1" cx="220" cy="110" r="140" fill="url(#glowGrad1)" />
    <circle class="pulse-glow-2" cx="980" cy="290" r="160" fill="url(#glowGrad2)" />
  </g>

  <!-- Background Telephony Waveform & Signal Paths (Kept far behind text) -->
  <g stroke="url(#callLineGrad)" fill="none" opacity="0.6">
    <!-- Curved SIP/VoIP Signal Path 1 -->
    <path class="signal-wave" d="M 60 360 C 260 380, 340 310, 500 340 C 700 380, 880 320, 1140 360" stroke-width="2" stroke-dasharray="12 8" />
    <!-- Curved SIP/VoIP Signal Path 2 -->
    <path d="M 80 80 C 320 40, 520 120, 780 60 C 950 20, 1080 80, 1150 110" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  </g>

  <!-- Right Side: Interactive Animated Audio Waveform & PBX Nodes -->
  <g transform="translate(980, 120)" opacity="0.85">
    <!-- Equalizer Audio Spectrum Bars (Animated) -->
    <g fill="url(#primaryGrad)">
      <rect class="audio-bar-1" x="-40" y="0" width="5" height="42" rx="2.5" />
      <rect class="audio-bar-2" x="-28" y="-8" width="5" height="58" rx="2.5" />
      <rect class="audio-bar-3" x="-16" y="-18" width="5" height="78" rx="2.5" />
      <rect class="audio-bar-4" x="-4" y="-5" width="5" height="52" rx="2.5" />
      <rect class="audio-bar-5" x="8" y="-14" width="5" height="70" rx="2.5" />
      <rect class="audio-bar-2" x="20" y="-3" width="5" height="48" rx="2.5" />
      <rect class="audio-bar-1" x="32" y="4" width="5" height="34" rx="2.5" />
    </g>
    <!-- SIP Trunk Telephony Orbit Node -->
    <circle cx="0" cy="90" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#nodeGlow)"/>
    <path d="M -9 82 C -9 82, -4 77, 0 81 C 4 85, 2 89, -1 92 C -3 94, 2 101, 7 101 C 10 98, 14 96, 18 100 C 22 104, 18 109, 18 109 C 14 113, 2 110, -7 101 C -16 92, -13 80, -9 82 Z" fill="#38bdf8" />
    <!-- Pulse ring -->
    <circle cx="0" cy="90" r="46" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
  </g>

  <!-- Left Side: VoIP Telephony Signal Icon -->
  <g transform="translate(90, 110)" opacity="0.8">
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Modern Dialpad / PBX Switch graphic -->
    <circle cx="-9" cy="-9" r="3.5" fill="#38bdf8" />
    <circle cx="0" cy="-9" r="3.5" fill="#818cf8" />
    <circle cx="9" cy="-9" r="3.5" fill="#c084fc" />
    <circle cx="-9" cy="0" r="3.5" fill="#818cf8" />
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    <circle cx="9" cy="0" r="3.5" fill="#818cf8" />
    <circle cx="-9" cy="9" r="3.5" fill="#c084fc" />
    <circle cx="0" cy="9" r="3.5" fill="#818cf8" />
    <circle cx="9" cy="9" r="3.5" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-150" cy="0" r="4.5" fill="#38bdf8" filter="url(#nodeGlow)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#38bdf8" text-anchor="middle">AWESOME TELEPHONY ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#primaryGrad)" text-anchor="middle">
    Cloud Phone &amp; Telephony (PBX)
  </text>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" text-anchor="middle">
    Top SaaS Communications Platforms &amp; Open-Source PBX / SIP Infrastructure
  </text>

  <!-- FOREGROUND CONTENT: Category Badges / Pills -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Cloud PBX -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">☁️ Cloud PBX</text>
    </g>
    <!-- Pill 2: VoIP & SIP -->
    <g transform="translate(-180, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">📞 VoIP &amp; SIP</text>
    </g>
    <!-- Pill 3: UCaaS -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">🌐 UCaaS</text>
    </g>
    <!-- Pill 4: WebRTC & Voice -->
    <g transform="translate(180, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f472b6" text-anchor="middle">⚡ WebRTC Voice</text>
    </g>
    <!-- Pill 5: Open Source -->
    <g transform="translate(360, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">🔓 Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(600, 320)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1.2" text-anchor="middle">
      Curated Pricing • Live Stars • Self-Hosted Telecom • Developer APIs
    </text>
  </g>

  <!-- Framing Border -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
</svg>
